name: Keep the API awake

# Render's free plan stops an API that has had no traffic for 15 minutes, and a stopped API sends no reminders and
# takes minutes to start again. A request every 10 minutes keeps it running (it fits the plan's monthly hours).
# GitHub may run scheduled jobs late; an uptime monitor on /actuator/health is the sturdier option.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping the API
        run: curl -fsS --max-time 30 --retry 8 --retry-delay 30 --retry-all-errors https://paynudge-api-mbjk.onrender.com/actuator/health

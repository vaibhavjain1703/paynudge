name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Tests run against a real Postgres through Testcontainers; the runner provides Docker.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same setup as `docker compose up -d` locally: Postgres for the API, Mailpit for the emails tests read.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: paynudge
          POSTGRES_USER: paynudge
          POSTGRES_PASSWORD: paynudge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paynudge" --health-interval 5s --health-timeout 5s --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports:
          - 1025:1025
          - 8025:8025
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Playwright starts the API (8180) and a production build of the web app (3100) itself.
      # Razorpay keys are placeholders: the tests send signed webhooks and never call Razorpay.
      - name: Run the browser tests
        env:
          RAZORPAY_KEY_ID: rzp_test_ci
          RAZORPAY_KEY_SECRET: ci-key-secret
        run: JWT_SECRET="$(openssl rand -base64 48)" npx playwright test

      - name: Keep the report
        id: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Link the report
        if: ${{ !cancelled() && steps.report.outputs.artifact-url != '' }}
        run: |
          {
            echo "### Browser test report"
            echo ""
            echo "[Download the HTML report](${{ steps.report.outputs.artifact-url }}) (unzip and open index.html: every test, with screenshots and, for failures, a step-by-step trace)."
          } >> "$GITHUB_STEP_SUMMARY"

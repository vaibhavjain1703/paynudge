# Local development services. Production runs the API on Render and Postgres on Supabase.
services:
  db:
    image: postgres:17-alpine
    container_name: paynudge-db
    environment:
      POSTGRES_DB: paynudge
      POSTGRES_USER: paynudge
      POSTGRES_PASSWORD: paynudge
    ports:
      - "5432:5432"
    volumes:
      - paynudge-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paynudge -d paynudge"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Local inbox: the API sends sign-in codes here over SMTP (port 1025); read them at http://localhost:8025.
  mail:
    image: axllent/mailpit:v1.31.3
    container_name: paynudge-mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  paynudge-db:

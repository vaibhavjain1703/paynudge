spring.application.name=paynudge-api

# Database. Defaults match docker-compose.yml for local development; deployments set DB_URL, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/paynudge}
spring.datasource.username=${DB_USERNAME:paynudge}
spring.datasource.password=${DB_PASSWORD:paynudge}

# Schema is owned by Flyway; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.threads.virtual.enabled=true

# Auth. JWT_SECRET is a base64 string of at least 32 random bytes (openssl rand -base64 48).
paynudge.jwt.secret=${JWT_SECRET:}
paynudge.jwt.ttl=${JWT_TTL:PT2H}
paynudge.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Outgoing email. MAIL_PROVIDER=smtp (default) uses spring.mail.*, which points at the local Mailpit inbox from
# docker-compose (read it at http://localhost:8025). MAIL_PROVIDER=brevo delivers to real inboxes through Brevo's
# HTTPS API (production uses it: Render's free plan blocks SMTP); MAIL_FROM must then be a sender verified in Brevo.
paynudge.mail.provider=${MAIL_PROVIDER:smtp}
paynudge.brevo.api-key=${BREVO_API_KEY:}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# The name sent in EHLO. Without it Jakarta Mail looks up this machine's hostname on every connect (slow on Windows).
spring.mail.properties.mail.smtp.localhost=${MAIL_SMTP_EHLO_NAME:localhost}
paynudge.mail.from=${MAIL_FROM:PayNudge <no-reply@paynudge.local>}

# Google sign-in. The Web OAuth client ID from Google Cloud; empty hides the button.
paynudge.google.client-id=${GOOGLE_CLIENT_ID:}

management.endpoints.web.exposure.include=health,info
# A slow or absent mail server must not make the API look unhealthy to the platform.
management.health.mail.enabled=false

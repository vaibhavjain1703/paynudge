spring.application.name=paynudge-api

# Database. Defaults match docker-compose.yml for local development; deployments set DB_URL, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/paynudge}
spring.datasource.username=${DB_USERNAME:paynudge}
spring.datasource.password=${DB_PASSWORD:paynudge}

# Schema is owned by Flyway; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.threads.virtual.enabled=true

# Auth. JWT_SECRET is a base64 string of at least 32 random bytes (openssl rand -base64 48).
paynudge.jwt.secret=${JWT_SECRET:}
paynudge.jwt.ttl=${JWT_TTL:PT2H}
paynudge.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management.endpoints.web.exposure.include=health,info

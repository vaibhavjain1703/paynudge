spring.application.name=paynudge-api

# The platform gives the port (Render sets PORT). Behind its proxy, the client's address and scheme come from the
# X-Forwarded-* headers, which the server only trusts from private-network proxies.
server.port=${PORT:8080}
server.forward-headers-strategy=native

# Database. Defaults match docker-compose.yml for local development; deployments set DB_URL, DB_USERNAME, DB_PASSWORD.
# Supabase's session pooler shares a small pool between all clients, so production keeps its own pool small.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/paynudge}
spring.datasource.username=${DB_USERNAME:paynudge}
spring.datasource.password=${DB_PASSWORD:paynudge}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
# How long startup keeps trying to reach the database (milliseconds; 1 fails at once, handy locally). On a tenth of a
# CPU (Render's free plan) the JVM's first TLS handshake is slower than Supabase's pooler waits for; the retry then
# succeeds, so production sets this to a couple of minutes.
spring.datasource.hikari.initialization-fail-timeout=${DB_CONNECT_TIMEOUT_MS:1}

# Schema is owned by Flyway; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.threads.virtual.enabled=true

# Auth. JWT_SECRET is a base64 string of at least 32 random bytes (openssl rand -base64 48).
paynudge.jwt.secret=${JWT_SECRET:}
paynudge.jwt.ttl=${JWT_TTL:PT2H}
paynudge.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Outgoing email. MAIL_PROVIDER=smtp (default) uses spring.mail.*, which points at the local Mailpit inbox from
# docker-compose (read it at http://localhost:8025). MAIL_PROVIDER=brevo delivers to real inboxes through Brevo's
# HTTPS API (production uses it: Render's free plan blocks SMTP); MAIL_FROM must then be a sender verified in Brevo.
paynudge.mail.provider=${MAIL_PROVIDER:smtp}
paynudge.brevo.api-key=${BREVO_API_KEY:}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# The name sent in EHLO. Without it Jakarta Mail looks up this machine's hostname on every connect (slow on Windows).
spring.mail.properties.mail.smtp.localhost=${MAIL_SMTP_EHLO_NAME:localhost}
paynudge.mail.from=${MAIL_FROM:PayNudge <no-reply@paynudge.local>}

# Google sign-in. The Web OAuth client ID from Google Cloud; empty hides the button.
paynudge.google.client-id=${GOOGLE_CLIENT_ID:}

# The web app's public address, used in links sent to customers (pay, unsubscribe).
paynudge.app-url=${APP_URL:http://localhost:3000}
# The API's own public address: mail clients POST one-click unsubscribes straight to it (RFC 8058).
paynudge.api-url=${API_URL:http://localhost:8080}

# Razorpay (test mode in the MVP). The key id and secret make payment links (empty: the pay page says online
# payment is not set up). The webhook secret is the one set on the webhook in Razorpay's dashboard;
# while it is empty every webhook is refused.
paynudge.razorpay.key-id=${RAZORPAY_KEY_ID:}
paynudge.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
paynudge.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Customer reminders never reach real customers in the MVP. REMINDER_DELIVERY=smtp (default) sends them to an SMTP
# sandbox: Mailpit locally (these defaults), or Mailtrap's sandbox (port 2525, which Render's free plan allows).
# REMINDER_DELIVERY=outbox emails nothing: each reminder is kept in PayNudge, where the owner reads it on the due's
# timeline (the live demo runs this way).
paynudge.reminders.delivery=${REMINDER_DELIVERY:smtp}
paynudge.reminders.host=${REMINDER_SMTP_HOST:localhost}
paynudge.reminders.port=${REMINDER_SMTP_PORT:1025}
paynudge.reminders.username=${REMINDER_SMTP_USERNAME:}
paynudge.reminders.password=${REMINDER_SMTP_PASSWORD:}
paynudge.reminders.starttls=${REMINDER_SMTP_STARTTLS:false}
paynudge.reminders.from=${REMINDER_MAIL_FROM:PayNudge reminders <reminders@paynudge.local>}

# Per-address limits on public routes and per-owner limits on AI features (RequestLimitsFilter, RateLimits).
# The e2e suite turns them off: it signs up dozens of owners from one address.
paynudge.rate-limits.enabled=${RATE_LIMITS_ENABLED:true}

# The reminder engine: worker loops on virtual threads (0 turns it off).
paynudge.engine.workers=${ENGINE_WORKERS:4}

# CSV uploads: one file of at most 2 MB per request (CsvReader also caps it at 5,000 rows).
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

management.endpoints.web.exposure.include=health,info
# A slow or absent mail server must not make the API look unhealthy to the platform.
management.health.mail.enabled=false
